name: Sync Upstream Mirror

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual triggers from the GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v7
        with:
          ref: sp-honda-dev-202606
          fetch-depth: 0

      - name: Sync with Upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add upstream remote
          git remote add upstream https://github.com/mvl-boston/opendbc.git
          git fetch upstream sp-honda-dev-202606

          # Hard reset local branch to match upstream exact state
          git reset --hard upstream/sp-honda-dev-202606
          git push --force origin sp-honda-dev-202606